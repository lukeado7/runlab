<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TriLab</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0c4a6e">
<style>
:root{--bg:#f4f6f7;--c:#fff;--t:#14171c;--m:#6b7280;--a:#0369a1;--b:#e1e5e9;--ok:#15803d;--no:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--c:#181b20;--t:#eceef1;--m:#9aa1ab;--a:#38bdf8;--b:#2a2f37;--ok:#4ade80;--no:#fbbf24}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{max-width:640px;margin:auto;padding:14px 12px 0;font-weight:800;font-size:22px;display:flex;justify-content:space-between;align-items:baseline}#v{max-width:640px;margin:auto;padding:12px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:12px}
h3{margin:4px 0 8px;font-size:15px}label{display:block;font-size:12px;color:var(--m);margin-bottom:2px}.m{color:var(--m);font-size:13px}
input,select,button{font:inherit;padding:9px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);width:100%;min-width:0}
button{background:var(--a);color:#fff;border:0;font-weight:600;width:auto;cursor:pointer}button.x{background:none;color:var(--m);padding:2px 8px}
.row{display:flex;gap:8px}.g2,.g3{display:grid;gap:8px;margin-bottom:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.big{font-size:20px;font-weight:700}.k{text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:var(--c);color:var(--t);border:1px solid var(--b)}.seg .on{background:var(--a);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}
.r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--b);font-size:14px}.r b{text-align:right}
nav{overflow-x:auto;position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}

.ok{color:var(--ok)}.no{color:var(--no)}
</style></head><body><header><span>Tri<span style="color:var(--a)">Lab</span></span><span id=who style="font-weight:500;font-size:14px;color:var(--m)"></span></header><div id=stat class=m style="max-width:640px;margin:auto;padding:4px 12px 0"></div><div id="v"></div>
<nav><button data-t=a onclick="go('a')">Atleti</button><button data-t=p onclick="go('p')">Profilo</button><button data-t=z onclick="go('z')">Zone</button><button data-t=h onclick="go('h')">HIIT</button><button data-t=s onclick="go('s')">Piano</button><button data-t=w onclick="go('w')">Palestra</button><button data-t=g onclick="go('g')">Gara</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={ath:[],sel:null,ses:[]};try{S=JSON.parse(localStorage.getItem('runlab'))||S}catch(e){}
const save=()=>{try{localStorage.setItem('runlab',JSON.stringify(S))}catch(e){}};
const A=()=>S.ath.find(a=>a.id==S.sel),today=()=>new Date().toISOString().slice(0,10);
const mas=a=>{if(!a||!a.tests.length)return 0;return [...a.tests].sort((x,y)=>x.d<y.d?1:-1)[0].m/360},MT=()=>mas(A())*.95;
const tf=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},pf=v=>v?tf(1000/v):'–',n0=x=>Math.round(x).toLocaleString('it');
// zone % MAStraining (lower,upper) e zone di Friel (rapporto passo lento, veloce rispetto alla soglia)
const ZP=[['1',null,.6],['2',.6,.7],['3',.7,.8],['4',.8,.9],['5a',.9,1],['5b',1,1.1],['5c',1.1,null]];
const ZF=[['1',null,1.29],['2',1.29,1.14],['3',1.13,1.06],['4',1.05,.99],['5a',1,.97],['5b',.96,.9],['5c',.9,null]];
const zoneOf=r=>{for(const z of ZP)if((z[1]==null||r>=z[1])&&(z[2]==null||r<z[2]))return z[0]};
const noMT='<div class=card><p class=m>Scegli un atleta nella scheda Atleti e inserisci un test MAS 6\' nel Profilo.</p></div>';
let tab='a',pd=0,pI=null,im='',sf='all';
function go(t){if(t){tab=t;pd=0}$('#v').innerHTML={a:vHome,p:vProf,z:vZone,h:vHiit,s:vSes,w:vGym,g:vRace}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#who').textContent=A()?A().name:'';document.querySelector('nav .on')?.scrollIntoView?.({inline:'center',block:'nearest'});if(tab=='h')hr();if(tab=='g')rr()}
/* GRAFICI + DATI */
function ch(L,ser,u){const all=ser.flatMap(s=>s.d.filter(x=>x!=null));if(L.length<2||!all.length)return'<p class=m>Servono almeno 2 punti per il grafico.</p>';
const W=320,Hh=120,p=26,mn=Math.min(...all),mx=Math.max(...all),r=mx-mn||1,X=i=>p+i*(W-2*p)/(L.length-1),Y=v=>Hh-p-(v-mn)/r*(Hh-2*p),t=(x,y,s,a)=>`<text x=${x} y=${y} font-size=10 text-anchor=${a} style="fill:var(--m)">${s}</text>`;
return`<svg viewBox="0 0 ${W} ${Hh+4}" style="width:100%;display:block"><line x1=${p} x2=${W-p} y1=${Hh-p} y2=${Hh-p} style="stroke:var(--b)"/>`+ser.map(s=>{const q=s.d.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);return`<polyline fill=none stroke-width=2 style="stroke:${s.c}" points="${q.map(z=>z.join(',')).join(' ')}"/>`+q.map(z=>`<circle cx=${z[0]} cy=${z[1]} r=3 style="fill:${s.c}"/>`).join('')}).join('')+t(2,12,mx.toFixed(1)+u,'start')+t(2,Hh-p-2,mn.toFixed(1)+u,'start')+t(p,Hh-8,L[0],'start')+t(W-p,Hh-8,L[L.length-1],'end')+'</svg>'}
function hb(K,D){const w=320,h=130,p=26,tot=k=>Object.values(D[k]).reduce((a,b)=>a+b,0),mx=Math.max(1,...K.map(tot)),bw=Math.min(28,(w-2*p)/K.length*.6),Y=v=>h-p-v/mx*(h-p-14),X=i=>p+(i+.5)*(w-2*p)/K.length,t=(x,y,s)=>`<text x=${x} y=${y} font-size=10 text-anchor=middle style="fill:var(--m)">${s}</text>`;
return`<svg viewBox="0 0 ${w} ${h+4}" style="width:100%;display:block"><line x1=${p} x2=${w-p} y1=${h-p} y2=${h-p} style="stroke:var(--b)"/>`+K.map((k,i)=>{let c=0;return Object.keys(SP).map(q=>{const v=D[k][q]||0,y1=Y(c),y2=Y(c+v);c+=v;return v?`<rect x=${X(i)-bw/2} y=${y2} width=${bw} height=${y1-y2} style="fill:${SC[q]}"/>`:''}).join('')+t(X(i),Y(c)-3,c.toFixed(1))+t(X(i),h-10,k)}).join('')+'</svg>'}
function bars(K,W){const w=320,h=130,p=26,mx=Math.max(1,...K.map(k=>Math.max(W[k].p,W[k].b+W[k].a))),bw=Math.min(28,(w-2*p)/K.length*.6),Y=v=>h-p-v/mx*(h-p-14),X=i=>p+(i+.5)*(w-2*p)/K.length,t=(x,y,s)=>`<text x=${x} y=${y} font-size=10 text-anchor=middle style="fill:var(--m)">${s}</text>`;
return`<svg viewBox="0 0 ${w} ${h+4}" style="width:100%;display:block"><line x1=${p} x2=${w-p} y1=${h-p} y2=${h-p} style="stroke:var(--b)"/>`+K.map((k,i)=>{const d=W[k],x=X(i)-bw/2,yb=Y(d.b),ya=Y(d.b+d.a),T=d.a+d.b;return`<rect x=${x} y=${yb} width=${bw} height=${h-p-yb} style="fill:var(--a)"/><rect x=${x} y=${ya} width=${bw} height=${yb-ya} style="fill:#ea580c"/>`+(d.p?`<line x1=${x-3} x2=${x+bw+3} y1=${Y(d.p)} y2=${Y(d.p)} stroke-width=2 style="stroke:var(--t)"/>`:'')+(T?t(X(i),ya-3,T.toFixed(1)):'')+t(X(i),h-10,k)}).join('')+'</svg>'}
const wk=d=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()-(x.getUTCDay()+6)%7);return x.toISOString().slice(5,10)};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
const expJ=()=>dl('trilab-backup-'+today()+'.json',JSON.stringify(S),'application/json');
function expC(){const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',r=[['Atleta','Data','Tipo','Zona','km previsti','min previsti','Note','km fatti','min fatti','RPE']];S.ses.forEach(s=>r.push([S.ath.find(a=>a.id==s.a)?.name,s.d,s.t,s.z,s.pk,s.pm,s.n,s.ak,s.am,s.rpe]));dl('trilab-piano.csv','\ufeff'+r.map(x=>x.map(q).join(';')).join('\n'),'text/csv')}
function impJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.ath)||!Array.isArray(d.ses))throw 0;pI=d;go()}catch(e){pI='err';go()}};r.readAsText(f)}
const dc=()=>`<div class=card><h3>Dati</h3><div class=row><button onclick=expJ()>Backup JSON</button><button onclick=expC()>Piano CSV</button><button onclick="$('#imp').click()">Importa</button></div>${pI==='err'?'<p class="m no">File non valido</p>':pI?`<p>Sostituire i dati attuali con il backup?</p><div class=row><button onclick="S=pI;pI=null;S.sel=S.sel||S.ath[0]?.id;save();go()">Sì, sostituisci</button><button onclick="pI=null;go()">Annulla</button></div>`:''}<input id=imp type=file accept=".json,application/json" hidden onchange="impJ(this.files[0])"></div>`;
/* ATLETA */
function addAth(){const n=($('#an').value||'').trim();if(!n)return;const a={id:Date.now(),name:n,tests:[]};S.ath.push(a);S.sel=a.id;save();go('p')}
function delAth(){if(!pd){pd=1;return go()}pd=0;{S.ses=S.ses.filter(s=>s.a!=S.sel);S.gym=(S.gym||[]).filter(g=>g.a!=S.sel);S.ath=S.ath.filter(a=>a.id!=S.sel);S.sel=null;save();go('a')}}
function addT(){const m=+$('#tm').value;if(!m)return;A().tests.push({d:$('#td').value||today(),m});save();go()}
function delT(i){A().tests.splice(i,1);save();go()}
const ap=(k,v)=>{const a=A();if(a){a[k]=v;save()}};
function vProf(){const a=A();if(!a)return noMT;const m=mas(a),f=(k,l,t='text')=>`<div><label>${l}</label><input type=${t} ${t=='number'?'inputmode=decimal ':''}value="${esc(a[k]??'')}" oninput="ap('${k}',this.value)"></div>`;
let h=`<div class=card><h3>Profilo atleta</h3><div class=g2>${f('name','Nome')}${f('nasc','Data di nascita','date')}${f('peso','Peso [kg]','number')}${f('alt','Altezza [cm]','number')}${f('fcmax','FC max [bpm]','number')}${f('ftp','FTP bici [W]','number')}${f('css','CSS nuoto [/100 m]')}${f('note','Note / obiettivi')}</div></div>`;

h+=`<div class=card><h3>Test MAS 6 minuti</h3><div class=row><input id=td type=date value=${today()}><input id=tm type=number inputmode=numeric placeholder="Metri in 6'"><button onclick=addT()>Aggiungi</button></div>`;
h+=[...a.tests].map((t,i)=>[t,i]).sort((x,y)=>x[0].d<y[0].d?1:-1).map(([t,i])=>`<div class=r><span>${t.d} · ${t.m} m</span><span>${pf(t.m/360)}/km <button class=x onclick=delT(${i})>✕</button></span></div>`).join('')+'</div>';
if(m)h+=`<div class=g3><div class=k><label>MAS</label><b>${m.toFixed(2)} m/s</b><div class=m>${pf(m)}/km</div></div><div class=k><label>km/h</label><b>${(m*3.6).toFixed(1)}</b></div><div class=k><label>Velocità training (−5%)</label><b>${(m*.95).toFixed(2)} m/s</b><div class=m>${pf(m*.95)}/km</div></div></div>`;
const T=[...a.tests].sort((x,y)=>x.d<y.d?-1:1);
if(T.length)h+=`<div class=card><h3>Andamento MAS [m/s]</h3>${ch(T.map(t=>t.d.slice(2)),[{c:'var(--a)',d:T.map(t=>t.m/360)}],'')}</div>`;
return h+icc()+`<button class=x onclick=delAth()>${pd?'Tocca ancora per confermare':'Elimina atleta'}</button>`}
/* ZONE */
function vZone(){const v=MT();if(!v)return noMT;
let h=`<div class=card><h3>Corsa · zone di passo (% velocità training)</h3><table><tr><th>Z</th><th>%</th><th>Passo/km</th><th>km/h</th></tr>${ZP.map(z=>{const hi=z[2]?v*z[2]:null,lo=z[1]?v*z[1]:null;return`<tr><td>${z[0]}</td><td>${z[1]?z[1]*100:'–'}–${z[2]?z[2]*100:'∞'}</td><td>${lo?pf(lo):'∞'} → ${hi?pf(hi):'–'}</td><td>${lo?(lo*3.6).toFixed(1):'–'}–${hi?(hi*3.6).toFixed(1):'∞'}</td></tr>`}).join('')}</table></div>`;
return h+`<div class=card><h3>Zone di Friel (soglia = MAS training)</h3><table><tr><th>Z</th><th>Passo lento</th><th>Passo veloce</th></tr>${ZF.map(z=>`<tr><td>${z[0]}</td><td>${z[1]?tf(1000/v*z[1]):'–'}</td><td>${z[2]?tf(1000/v*z[2]):'–'}</td></tr>`).join('')}</table><p class=m>Percentuali Friel come nel file: verificale se serve precisione.</p></div>`}
/* HIIT */
const D={t:{w:180,wl:100,wh:110,r:180,rl:50,rh:60,s:2,n:8},d:{w:1000,wl:90,wh:100,r:200,rl:60,rh:70,s:2,n:5}};let H={m:'t',...D.t};
const inp=(k,l)=>`<div><label>${l}</label><input type=number inputmode=decimal value=${H[k]} oninput="H.${k}=+this.value;hr()"></div>`;
function hm(m){H={m,...D[m]};go()}
function vHiit(){const t=H.m=='t',u=t?'Tempo [s]':'Distanza [m]';
return`<p class=m>Corsa · intervalli ad alta intensità</p><div class=seg><button class="${t?'on':''}" onclick="hm('t')">Per tempo</button><button class="${t?'':'on'}" onclick="hm('d')">Per distanza</button></div><div class=card><h3>Lavoro</h3><div class=g3>${inp('w',u)}${inp('wl','Int. min %MAS')}${inp('wh','Int. max %MAS')}</div><h3>Recupero</h3><div class=g3>${inp('r',u)}${inp('rl','Int. min %MAS')}${inp('rh','Int. max %MAS')}</div><h3>Struttura</h3><div class=g2>${inp('s','Serie')}${inp('n','Ripetute')}</div></div><div id=hout></div>`}
function hc(){const v=MT();if(!v)return null;const{w,wl,wh,r,rl,rh,s,n,m}=H,k=s*n,L=[];let pk,pm,pw;
const R=(a,b)=>L.push([a,b]);R('Passo lavoro',`${pf(v*wl/100)} – ${pf(v*wh/100)} /km`);R('Passo recupero',`${pf(v*rl/100)} – ${pf(v*rh/100)} /km`);
if(m=='t'){const a=w*v*wl/100,b=w*v*wh/100,c=r*v*rl/100,d=r*v*rh/100;R('Lavoro per ripetuta',`${n0(a)} – ${n0(b)} m`);R('Recupero per ripetuta',`${n0(c)} – ${n0(d)} m`);R('Distanza totale',`${n0(k*(a+c))} – ${n0(k*(b+d))} m`);R('Durata totale',tf(k*(w+r)));R('Tempo di lavoro (t@vVO2max)',tf(k*w));R('t@VO2max (⅓ del lavoro)',tf(k*w/3));pk=k*(a+b+c+d)/2/1000;pw=k*(a+b)/2/1000;pm=k*(w+r)/60}
else{const a=w/(v*wh/100),b=w/(v*wl/100),c=r/(v*rh/100),d=r/(v*rl/100);R('Lavoro per ripetuta',`${tf(a)} – ${tf(b)}`);R('Recupero per ripetuta',`${tf(c)} – ${tf(d)}`);R('Distanza totale',`${n0(k*(w+r))} m`);R('Durata totale',`${tf(k*(a+c))} – ${tf(k*(b+d))}`);R('Tempo di lavoro (t@vVO2max)',`${tf(k*a)} – ${tf(k*b)}`);R('t@VO2max (⅓ del lavoro)',`${tf(k*a/3)} – ${tf(k*b/3)}`);pk=k*(w+r)/1000;pw=k*w/1000;pm=k*(a+b+c+d)/2/60}
const fr=wh>wl?Math.min(1,Math.max(0,(wh-TH*100)/(wh-wl))):(wl>=TH*100?1:0);return{L,pk,pm,pw:pw*fr}}
let HC;function hr(){HC=hc();$('#hout').innerHTML=HC?`<div class=card>${HC.L.map(x=>`<div class=r><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<p><button onclick=addH()>Aggiungi al piano</button></p></div>`:noMT}
function addH(){const{w,wl,wh,r,rl,rh,s,n,m}=H,u=m=='t'?'s':'m';S.ses.push({id:Date.now(),a:S.sel,d:today(),t:'HIIT',z:'-',pk:HC.pk.toFixed(1),kw:HC.pw.toFixed(2),pm:Math.round(HC.pm),n:`${s}×${n} · ${w}${u} @${wl}–${wh}% / rec ${r}${u} @${rl}–${rh}%`,ak:'',am:'',rpe:''});save();go('s')}
/* SPORT */
const SP={swim:['Nuoto','m'],bike:['Bici','km'],run:['Corsa','km'],gym:['Palestra','']},SC={swim:'#0ea5e9',bike:'#f59e0b',run:'#16a34a',gym:'#8b5cf6'},TY={run:['Facile','Lungo','Soglia','Fartlek','Gara','Altro'],bike:['Facile','Lungo','Intervalli','Brick','Gara','Altro'],swim:['Tecnica','Resistenza','Intervalli','Acque libere','Gara','Altro'],gym:['Forza','Core','Mobilità','Altro']};
const SPM=t=>/Run/.test(t)?'run':/Ride|Bike/.test(t)?'bike':/Swim/.test(t)?'swim':/Weight|Workout|Crossfit|Strength|Yoga|Pilates/i.test(t)?'gym':null,fm=(sp,k)=>sp=='swim'?Math.round(k*1000)+' m':(+k).toFixed(1)+' km';
/* INTERVALS.ICU */
const IC=()=>{try{return JSON.parse(localStorage.getItem('rl_icu')||'{}')[S.sel]||{}}catch(e){return{}}};
const setSt=t=>{const e=$('#stat');if(e)e.textContent=t||''},setIC=(k,v)=>{try{const K=JSON.parse(localStorage.getItem('rl_icu')||'{}');K[S.sel]={...(K[S.sel]||{}),[k]:v};localStorage.setItem('rl_icu',JSON.stringify(K))}catch(e){}};
const icc=()=>{const c=IC(),a=A();return`<div class=card><h3>Account intervals.icu</h3><div class=g2><div><label>Athlete ID (0 = proprio)</label><input value="${esc(c.id||'0')}" oninput="setIC('id',this.value.trim())"></div><div><label>Primo import</label><select onchange="setIC('days',this.value)">${[[90,'3 mesi'],[180,'6 mesi'],[365,'1 anno']].map(o=>`<option value=${o[0]} ${(c.days||180)==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div><label>API key (Impostazioni → Developer Settings)</label><input type=password value="${esc(c.key||'')}" oninput="setIC('key',this.value.trim())" style="margin-bottom:8px"><button onclick=icuSync()>Sincronizza ora</button><p class=m>${a.last?'Ultima sincronizzazione: '+a.last.slice(0,10):'Mai sincronizzato'}. Quando scegli l'atleta nella schermata iniziale le nuove attività vengono scaricate in automatico.</p></div>`};
function pick(id){S.sel=id;save();go('s');icuSync()}
function vHome(){let h=S.ath.length?'<p class=m>Tocca un atleta per aprire il suo piano e scaricare le nuove attività da intervals.icu.</p>':'<p class=m>Nessun atleta: aggiungine uno per iniziare.</p>';
h+=S.ath.map(a=>{const n=S.ses.filter(s=>s.a==a.id).length,m=mas(a);return`<div class=card style="cursor:pointer;${a.id==S.sel?'border-color:var(--a)':''}" onclick="pick(${a.id})"><div class=r style="border:0;padding:0"><b>${esc(a.name)}</b><span class=m>${n} attività</span></div><div class=m>${m?'MAS '+pf(m)+'/km':'Nessun test MAS'} · ${a.last?'sync '+a.last.slice(0,10):'mai sincronizzato'}</div></div>`}).join('');
return h+`<div class=card><h3>Nuovo atleta</h3><div class=row><input id=an placeholder="Nome e cognome"><button onclick=addAth()>Aggiungi</button></div></div>`+dc()}
